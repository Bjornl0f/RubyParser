# Конфігурація баз даних
# Підтримує SQLite та MongoDB

database:
  # Тип бази даних: sqlite або mongodb
  type: "sqlite"
  
  # ============================================
  # Налаштування SQLite
  # ============================================
  sqlite:
    # Шлях до файлу бази даних
    database_path: "db/books_parser.sqlite3"
    
    # Налаштування з'єднання
    timeout: 5000
    
  # ============================================
  # Налаштування MongoDB
  # ============================================
  mongodb:
    # URI для підключення
    uri: "mongodb://localhost:27017"
    
    # Назва бази даних
    database_name: "books_parser"
    
    # Назва колекції
    collection_name: "books"
  
  # ============================================
  # Схема таблиць/колекцій
  # ============================================
  schema:
    books:
      name: "books"
      columns:
        - id: "INTEGER PRIMARY KEY AUTOINCREMENT"
        - title: "TEXT NOT NULL"
        - price: "REAL"
        - rating: "INTEGER"
        - availability: "TEXT"
        - category: "TEXT"
        - url: "TEXT"
        - image_path: "TEXT"
        - description: "TEXT"
        - created_at: "DATETIME DEFAULT CURRENT_TIMESTAMP"
    
    categories:
      name: "categories"
      columns:
        - id: "INTEGER PRIMARY KEY AUTOINCREMENT"
        - name: "TEXT NOT NULL UNIQUE"
        - url: "TEXT"
        - book_count: "INTEGER DEFAULT 0"
